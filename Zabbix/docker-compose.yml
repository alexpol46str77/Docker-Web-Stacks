services:
  zabbix-db:
    image: mariadb:10.11
    restart: always
    environment:
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=change_me_in_production
      - MYSQL_ROOT_PASSWORD=root_password_placeholder
    volumes:
      - zabbix-db-data:/var/lib/mysql
    networks:
      - zabbix-net

  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.0-latest
    restart: always
    ports:
      - "10051:10051"
    environment:
      - DB_SERVER_HOST=zabbix-db
      - DB_SERVER_PORT=3306
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=change_me_in_production
    depends_on:
      - zabbix-db
    networks:
      - zabbix-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:ubuntu-7.0-latest
    restart: always
    ports:
      - "8045:8080"
    environment:
      - DB_SERVER_HOST=zabbix-db
      - DB_SERVER_PORT=3306
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=change_me_in_production
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=10051
    depends_on:
      - zabbix-server
    networks:
      - zabbix-net

  zabbix-agent:
    image: zabbix/zabbix-agent:ubuntu-7.0-latest
    restart: always
    network_mode: "host"
    environment:
      - ZBX_SERVER_HOST=127.0.0.1

networks:
  zabbix-net:
    driver: bridge

volumes:
  zabbix-db-data:
    driver: local